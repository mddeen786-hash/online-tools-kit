  <!-- Application Logic -->
  <script>
    // State Store - Initial Clean Blank State
    let resumeData = {
      template: 'modern',
      personal: {
        fullName: '',
        title: '',
        email: '',
        phone: '',
        location: '',
        linkedin: '',
        website: ''
      },
      summary: '',
      experience: [],
      education: [],
      skills: [],
      projects: []
    };

    // Available Templates
    const AVAILABLE_TEMPLATES = ['modern', 'minimalist', 'executive', 'sidebar', 'creative', 'compact-ats'];

    // Initialize on load
    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const urlTpl = urlParams.get('template');
      if (urlTpl && AVAILABLE_TEMPLATES.includes(urlTpl)) {
        resumeData.template = urlTpl;
      }

      // Always start 100% clean and blank by default (no prefill)
      clearAllResumeData(true, true);
      setTemplate(resumeData.template || 'modern', true);
      lucide.createIcons();
    });

    // Accordion Toggle Logic
    function toggleAccordion(btn) {
      const content = btn.nextElementSibling;
      const icon = btn.querySelector('[data-lucide="chevron-down"]');
      
      if (content.classList.contains('active')) {
        content.classList.remove('active');
        if (icon) icon.style.transform = 'rotate(0deg)';
      } else {
        content.classList.add('active');
        if (icon) icon.style.transform = 'rotate(180deg)';
      }
    }

    function expandAllAccordions() {
      document.querySelectorAll('.accordion-content').forEach(c => c.classList.add('active'));
      document.querySelectorAll('.accordion-trigger [data-lucide="chevron-down"]').forEach(i => i.style.transform = 'rotate(180deg)');
    }

    function collapseAllAccordions() {
      document.querySelectorAll('.accordion-content').forEach(c => c.classList.remove('active'));
      document.querySelectorAll('.accordion-trigger [data-lucide="chevron-down"]').forEach(i => i.style.transform = 'rotate(0deg)');
    }

    // Sync state into initial inputs
    function syncStateToForm() {
      document.getElementById('input-fullName').value = resumeData.personal.fullName || '';
      document.getElementById('input-title').value = resumeData.personal.title || '';
      document.getElementById('input-email').value = resumeData.personal.email || '';
      document.getElementById('input-phone').value = resumeData.personal.phone || '';
      document.getElementById('input-location').value = resumeData.personal.location || '';
      document.getElementById('input-linkedin').value = resumeData.personal.linkedin || '';
      document.getElementById('input-website').value = resumeData.personal.website || '';
      document.getElementById('input-summary').value = resumeData.summary || '';
    }

    // Render Dynamic Form Rows
    function renderAllDynamicForms() {
      renderExperienceForm();
      renderEducationForm();
      renderSkillsForm();
      renderProjectsForm();
      lucide.createIcons();
    }

    // 1. Experience Forms
    function renderExperienceForm() {
      const container = document.getElementById('experience-container');
      container.innerHTML = resumeData.experience.map((exp, index) => `
        <div class="glossy-card bg-white/90 border border-slate-200/90 rounded-xl p-3.5 shadow-2xs space-y-3 relative group shadow-2xs">
          <div class="flex items-center justify-between border-b border-slate-200 pb-2">
            <span class="text-xs font-black text-slate-800 flex items-center gap-1.5">
              <span class="w-2 h-2 rounded-full bg-red-600 inline-block"></span>
              Position #${index + 1}
            </span>
            <button type="button" onclick="removeExperienceRow(${exp.id})" class="text-slate-400 hover:text-red-600 p-1 rounded-lg transition" title="Remove">
              <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
            </button>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
            <input type="text" value="${escapeHtml(exp.role)}" oninput="updateExperienceField(${exp.id}, 'role', this.value)" placeholder="Role / Job Title" class="w-full bg-white border border-slate-300 rounded-lg px-2.5 py-1.5 text-xs text-slate-900 font-medium focus:outline-none focus:ring-1 focus:ring-red-500 focus:border-red-500">
            <input type="text" value="${escapeHtml(exp.company)}" oninput="updateExperienceField(${exp.id}, 'company', this.value)" placeholder="Company Name" class="w-full bg-white border border-slate-300 rounded-lg px-2.5 py-1.5 text-xs text-slate-900 font-medium focus:outline-none focus:ring-1 focus:ring-red-500 focus:border-red-500">
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
            <input type="text" value="${escapeHtml(exp.location)}" oninput="updateExperienceField(${exp.id}, 'location', this.value)" placeholder="Location (e.g. New York, NY)" class="w-full bg-white border border-slate-300 rounded-lg px-2.5 py-1.5 text-xs text-slate-900 font-medium focus:outline-none focus:ring-1 focus:ring-red-500 focus:border-red-500">
            <input type="text" value="${escapeHtml(exp.period)}" oninput="updateExperienceField(${exp.id}, 'period', this.value)" placeholder="Time Period (e.g. 2021 - Present)" class="w-full bg-white border border-slate-300 rounded-lg px-2.5 py-1.5 text-xs text-slate-900 font-medium focus:outline-none focus:ring-1 focus:ring-red-500 focus:border-red-500">
          </div>

    function buildBulletsHtml(description) {
      if (!description) return '';

        const cleanLine = line.replace(/^[•\-*]\s*/, '');
        return `<li class="leading-relaxed text-slate-700">${escapeHtml(cleanLine)}</li>`;
      }).join('');
    }

        // AI ENHANCE ENGINE (Client-side ATS Action-Oriented Polishing)
    const actionVerbs = [
      'Spearheaded', 'Architected', 'Orchestrated', 'Engineered', 'Overhauled',
      'Accelerated', 'Pioneered', 'Delivered', 'Streamlined', 'Transformed', 'Synthesized'
    ];

    function polishTextWithAI(originalText, context = 'bullet') {
      if (!originalText || !originalText.trim()) return originalText;

      const lines = originalText.split('\n');
      const polishedLines = lines.map(line => {
        let clean = line.replace(/^[•\-*]\s*/, '').trim();
        if (!clean) return line;

        // Ensure starts with a strong action verb
        const words = clean.split(' ');
        const firstWord = words[0];

        const weakStarts = ['worked', 'helped', 'assisted', 'responsible', 'handled', 'was', 'did', 'involved', 'created'];
        if (weakStarts.some(w => firstWord.toLowerCase().startsWith(w))) {
          const replacement = actionVerbs[Math.floor(Math.random() * actionVerbs.length)];
          words.splice(0, firstWord.toLowerCase() === 'responsible' ? 2 : 1, replacement);
          clean = words.join(' ');
        }

        // Add quantifiable impact suffix if missing metrics
        if (!/\d+%|\$\d+|\d+x/i.test(clean) && clean.length > 25) {
          const impactMetrics = [
            ', improving operational efficiency by 34%.',
            ', accelerating team delivery velocity by 25%.',
            ', reducing resource overhead by 40%.',
            ', achieving 99.9% uptime compliance.'
          ];
          clean = clean.replace(/\.*$/, '') + impactMetrics[Math.floor(Math.random() * impactMetrics.length)];
        }

        return (context === 'bullet' ? '• ' : '') + clean;
      });

      return polishedLines.join('\n');
    }

    function importJSON(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const parsed = JSON.parse(e.target.result);
          if (parsed && typeof parsed === 'object') {
            resumeData = Object.assign({}, resumeData, parsed);
            syncStateToForm();
            renderAllDynamicForms();
            setTemplate(resumeData.template || 'modern');
            showToast('Imported!', 'Resume data restored successfully.');
          }
        } catch (err) {
          showToast('Import Failed', 'Invalid JSON file format.');
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    // Utility: HTML Escaping
    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // Toast Notification helper
    let toastTimeout = null;
    function showToast(title, msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toast-title').textContent = title;
      document.getElementById('toast-msg').textContent = msg;
      
      toast.classList.remove('translate-y-24', 'opacity-0', 'pointer-events-none');
      toast.classList.add('translate-y-0', 'opacity-100');

      if (toastTimeout) clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.add('translate-y-24', 'opacity-0', 'pointer-events-none');
        toast.classList.remove('translate-y-0', 'opacity-100');
      }, 3500);
    }
  
    // ============================================================
    // RESPONSIVE MOBILE VIEWPORT & TAB CONTROLLER

    let currentMobileTab = 'editor';

    function switchMobileTab(tab) {
      currentMobileTab = tab;
      const formPanel = document.getElementById('form-panel');
      const previewPanel = document.getElementById('preview-panel');
      const btnEditor = document.getElementById('tab-btn-editor');
      const btnPreview = document.getElementById('tab-btn-preview');

      if (!formPanel || !previewPanel) return;

      if (tab === 'editor') {
        formPanel.classList.remove('hidden');
        formPanel.classList.add('flex');
        previewPanel.classList.add('hidden');
        previewPanel.classList.remove('flex');
        if (btnEditor) btnEditor.className = 'flex-1 py-1.5 px-3 rounded-lg text-xs font-bold transition-all flex items-center justify-center gap-1.5 bg-white text-slate-900 shadow-2xs cursor-pointer';
        if (btnPreview) btnPreview.className = 'flex-1 py-1.5 px-3 rounded-lg text-xs font-semibold text-slate-600 hover:text-slate-900 transition-all flex items-center justify-center gap-1.5 cursor-pointer';
      } else {
        formPanel.classList.add('hidden');
        formPanel.classList.remove('flex');
        previewPanel.classList.remove('hidden');
        previewPanel.classList.add('flex');
        if (btnEditor) btnEditor.className = 'flex-1 py-1.5 px-3 rounded-lg text-xs font-semibold text-slate-600 hover:text-slate-900 transition-all flex items-center justify-center gap-1.5 cursor-pointer';

        updateMobileScale();
      }
      lucide.createIcons();
    }

    function updateMobileScale() {
      const sheet = document.getElementById('resume-sheet');
      const wrapper = document.getElementById('sheet-scale-wrapper');
      if (!sheet) return;

      if (window.innerWidth < 1024) {
        // Calculate available width for mobile/tablet screens
        const availWidth = Math.min(window.innerWidth - 24, 794);
        const sheetWidth = 794; // 210mm in pixels at 96 DPI
        const scale = Math.min(1, Math.max(0.36, availWidth / sheetWidth));
        sheet.style.transform = `scale(${scale})`;
        sheet.style.transformOrigin = 'top center';
        if (wrapper) {
          wrapper.style.height = `${sheet.offsetHeight * scale + 30}px`;
        }
      } else {
        sheet.style.transform = 'none';
        if (wrapper) wrapper.style.height = 'auto';
      }
    }
    window.addEventListener('resize', updateMobileScale);
