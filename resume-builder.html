        currentGalleryFilter = cat;

        }
        renderGalleryCards();
      }

        if (!grid) return;
        const currentTpl = resumeData.template || 'modern-slate';

                  </div>
                  ${isSelected ? `<span class="bg-red-600 text-white text-[10px] font-bold px-2 py-0.5 rounded-full flex items-center gap-1 shadow-2xs"><i data-lucide="check" class="w-3 h-3"></i> Active</span>` : ''}

      // Generate a mini visual layout preview for the gallery cards
      function getMiniSchematicHtml(t) {
        if (t.cat === 'sidebars') {

            return `<div class="w-2/3 h-full bg-white rounded border border-slate-300"></div><div class="w-1/3 h-full rounded" style="background:${t.color}"></div>`;

          return `<div class="w-1/3 h-full rounded" style="background:${t.color}"></div><div class="w-2/3 h-full bg-white rounded border border-slate-300"></div>`;
        } else if (t.cat === 'timelines') {
          if (t.id === 'modern-cards') {
            return `<div class="w-full h-full flex gap-1"><div class="w-1/2 h-full bg-white rounded border border-indigo-200"></div><div class="w-1/2 h-full bg-white rounded border border-indigo-200"></div></div>`;

            return `<div class="w-full h-full flex flex-col gap-0.5"><div class="h-1/2 w-full flex"><div class="w-1/3 h-full bg-slate-900"></div><div class="w-2/3 h-full bg-slate-200"></div></div><div class="h-1/2 w-full bg-white rounded border border-slate-300"></div></div>`;

          return `<div class="w-1.5 h-full rounded-full" style="background:${t.color}"></div><div class="flex-1 h-full flex flex-col justify-center gap-1"><div class="h-1.5 w-3/4 bg-slate-300 rounded"></div><div class="h-1.5 w-1/2 bg-slate-200 rounded"></div></div>`;

      // Template Switcher Trigger (Supports 22 Distinct Layouts)
      function setTemplate(tplName, silent = false) {
        // Backwards compatibility aliases
        if (tplName === 'modern') tplName = 'modern-slate';
        if (tplName === 'sidebar' || tplName === 'left-sidebar') tplName = 'nordic-sidebar';
        if (tplName === 'right-sidebar') tplName = 'navy-sidebar';
        if (tplName === 'minimalist') tplName = 'minimalist-pure';
        if (tplName === 'executive' || tplName === 'ivy') tplName = 'executive-ivy';
        if (tplName === 'timeline') tplName = 'timeline-red';
        if (tplName === 'creative') tplName = 'creative-gradient';
        if (tplName === 'tech') tplName = 'terminal-dev';
        if (tplName === 'framed') tplName = 'framed-crest';

        if (!AVAILABLE_TEMPLATES.includes(tplName)) tplName = 'modern-slate';
        resumeData.template = tplName;

        const currentTplObj = RESUME_TEMPLATES.find(t => t.id === tplName) || RESUME_TEMPLATES[0];

        // Update Top Bar Gallery Button label
        const galleryBtnLabel = document.getElementById('gallery-btn-label');
        if (galleryBtnLabel) {
          galleryBtnLabel.textContent = `${currentTplObj.name} ▾`;
        }

        // Update Top Bar 4 Quick-Pill Highlights
        const quickPills = ['modern-slate', 'nordic-sidebar', 'timeline-red', 'executive-ivy'];
        quickPills.forEach(id => {
          const btn = document.getElementById(`tpl-btn-${id}`);
          if (!btn) return;
          if (id === tplName) {
            btn.className = 'px-2.5 py-1.5 rounded-lg font-bold transition-all bg-red-600 text-white shadow-xs whitespace-nowrap flex items-center gap-1';
          } else {
            btn.className = 'px-2.5 py-1.5 rounded-lg font-semibold transition-all text-slate-600 hover:text-slate-900 whitespace-nowrap flex items-center gap-1';
          }
        });

        updateResume();
        if (!silent) {
          showToast('Template Applied', `Switched to ${currentTplObj.name}`);
        }
      }

    function toggleAccordion(btn) {
      const content = btn.nextElementSibling;
      const icon = btn.querySelector('[data-lucide="chevron-down"]');
      
      if (content.classList.contains('active')) {
        content.classList.remove('active');
        if (icon) icon.style.transform = 'rotate(0deg)';
      } else {
        content.classList.add('active');
        if (icon) icon.style.transform = 'rotate(180deg)';
      }
    }

    function expandAllAccordions() {
      document.querySelectorAll('.accordion-content').forEach(c => c.classList.add('active'));
      document.querySelectorAll('.accordion-trigger [data-lucide="chevron-down"]').forEach(i => i.style.transform = 'rotate(180deg)');
    }

    function collapseAllAccordions() {
      document.querySelectorAll('.accordion-content').forEach(c => c.classList.remove('active'));
      document.querySelectorAll('.accordion-trigger [data-lucide="chevron-down"]').forEach(i => i.style.transform = 'rotate(0deg)');

    // ============================================================
    // SECTION RENAMING, REPLACING, DELETING & RESTORING
    // ============================================================
    function getSectionTitle(key, defaultTitle) {
      if (resumeData.sectionConfig && resumeData.sectionConfig[key] && typeof resumeData.sectionConfig[key].title === 'string' && resumeData.sectionConfig[key].title.trim().length > 0) {
        return resumeData.sectionConfig[key].title.trim();
      }
      const inputEl = document.getElementById(`title-input-${key}`);
      if (inputEl && inputEl.value && inputEl.value.trim().length > 0) {
        return inputEl.value.trim();
      }
      return defaultTitle;
    }

    function isSectionVisible(key) {
      if (resumeData.sectionConfig && resumeData.sectionConfig[key] && resumeData.sectionConfig[key].visible !== undefined) {
        return resumeData.sectionConfig[key].visible;
      }
      return true;
    }

    function updateSectionTitle(key, newTitle) {
      if (!resumeData.sectionConfig) resumeData.sectionConfig = {};
      if (!resumeData.sectionConfig[key]) resumeData.sectionConfig[key] = { visible: true };
      resumeData.sectionConfig[key].title = newTitle;
      updateResume();
    }

    function deleteSection(key) {
      const title = getSectionTitle(key, key);
      if (!confirm(`Are you sure you want to delete / hide the "${title}" section? You can restore it anytime from "Restore Hidden Sections".`)) return;
      if (!resumeData.sectionConfig) resumeData.sectionConfig = {};
      if (!resumeData.sectionConfig[key]) resumeData.sectionConfig[key] = {};
      resumeData.sectionConfig[key].visible = false;
      renderSectionManager();
      updateResume();
      showToast('Section Hidden', `"${title}" has been removed from resume.`);
    }

    function restoreSection(key) {
      if (!resumeData.sectionConfig) resumeData.sectionConfig = {};
      if (!resumeData.sectionConfig[key]) resumeData.sectionConfig[key] = {};
      resumeData.sectionConfig[key].visible = true;
      renderSectionManager();
      updateResume();
      showToast('Section Restored', `"${getSectionTitle(key, key)}" is now visible.`);
    }

    function renderSectionManager() {
      const sections = [
        { key: 'summary', name: 'Professional Summary' },
        { key: 'experience', name: 'Work Experience' },
        { key: 'education', name: 'Education' },
        { key: 'skills', name: 'Skills & Expertise' },
        { key: 'projects', name: 'Key Projects' }
      ];

      sections.forEach(sec => {
        const el = document.getElementById(`acc-${sec.key}`);
        if (el) {
          el.style.display = isSectionVisible(sec.key) ? 'block' : 'none';
        }
        const input = document.getElementById(`title-input-${sec.key}`);
        if (input) {
          input.value = getSectionTitle(sec.key, sec.name);
        }
      });

      const pInput = document.getElementById('title-input-personal');
      if (pInput) pInput.value = getSectionTitle('personal', 'Personal Details');

      // Update Restore Bar
      const restoreBar = document.getElementById('section-restore-bar');
      const restoreContainer = document.getElementById('restore-sections-container');
      if (restoreBar && restoreContainer) {
        const hidden = sections.filter(sec => !isSectionVisible(sec.key));
        if (hidden.length === 0) {
          restoreBar.style.display = 'none';
          restoreContainer.innerHTML = '';
        } else {
          restoreBar.style.display = 'block';
          restoreContainer.innerHTML = hidden.map(sec => `
            <button type="button" onclick="restoreSection('${sec.key}')" class="px-2.5 py-1 bg-red-100 hover:bg-red-200 text-red-700 border border-red-300 rounded-lg text-2xs font-bold transition-all flex items-center gap-1 cursor-pointer">
              <i data-lucide="plus" class="w-3 h-3"></i> Restore ${getSectionTitle(sec.key, sec.name)}
            </button>
          `).join('');
        }
      }

      lucide.createIcons();
    }

    // Helper: Render Custom / General Section Content (single text or bullets)
    function renderSectionContentHtml(content, isBlackText = false, customColorClass = '') {
      if (!content) return '';
      const trimmed = content.trim();
      const lines = trimmed.split('\n').map(l => l.trim()).filter(Boolean);
      const textClass = customColorClass ? customColorClass : (isBlackText ? 'text-black' : 'text-slate-700');
      if (lines.length > 1 || trimmed.startsWith('•') || trimmed.startsWith('-') || trimmed.startsWith('*')) {
        return `<ul class="list-disc list-outside pl-4 text-xs space-y-1 ${textClass}">${buildBulletsHtml(content, textClass)}</ul>`;
      }
      return `<p class="text-xs leading-relaxed ${textClass} whitespace-pre-line font-medium">${escapeHtml(trimmed)}</p>`;
    }

    // Helper: Build Bullet HTML
    function buildBulletsHtml(description, colorClass = '') {
      if (!description) return '';
      const lines = description.split('\n').filter(line => line.trim().length > 0);
      const liClass = colorClass ? colorClass : 'text-slate-700';
      return lines.map(line => {
        const cleanLine = line.replace(/^[•\-*]\s*/, '');
        return `<li class="leading-relaxed ${liClass}">${escapeHtml(cleanLine)}</li>`;
      }).join('');
    }

        // AI ENHANCE ENGINE (Client-side ATS Action-Oriented Polishing)
    const actionVerbs = [
      'Spearheaded', 'Architected', 'Orchestrated', 'Engineered', 'Overhauled',
      'Accelerated', 'Pioneered', 'Delivered', 'Streamlined', 'Transformed', 'Synthesized'
    ];

    function polishTextWithAI(originalText, context = 'bullet') {
      if (!originalText || !originalText.trim()) return originalText;

      const lines = originalText.split('\n');
      const polishedLines = lines.map(line => {
        let clean = line.replace(/^[•\-*]\s*/, '').trim();
        if (!clean) return line;

        // Ensure starts with a strong action verb
        const words = clean.split(' ');
        const firstWord = words[0];

        const weakStarts = ['worked', 'helped', 'assisted', 'responsible', 'handled', 'was', 'did', 'involved', 'created'];
        if (weakStarts.some(w => firstWord.toLowerCase().startsWith(w))) {
          const replacement = actionVerbs[Math.floor(Math.random() * actionVerbs.length)];
          words.splice(0, firstWord.toLowerCase() === 'responsible' ? 2 : 1, replacement);
          clean = words.join(' ');
        }

        // Add quantifiable impact suffix if missing metrics
        if (!/\d+%|\$\d+|\d+x/i.test(clean) && clean.length > 25) {
          const impactMetrics = [
            ', improving operational efficiency by 34%.',
            ', accelerating team delivery velocity by 25%.',
            ', reducing resource overhead by 40%.',
            ', achieving 99.9% uptime compliance.'
          ];
          clean = clean.replace(/\.*$/, '') + impactMetrics[Math.floor(Math.random() * impactMetrics.length)];
        }

        return (context === 'bullet' ? '• ' : '') + clean;
      });

      return polishedLines.join('\n');
    }

      if (!str) return '';
      return String(str)

        .replace(/</g, '&lt;')

        .replace(/"/g, '&quot;')

    function updateMobileScale() {
      const sheet = document.getElementById('resume-sheet');
      const wrapper = document.getElementById('sheet-scale-wrapper');
      if (!sheet) return;

      if (window.innerWidth < 1024) {
        // Calculate available width for mobile/tablet screens
        const availWidth = Math.min(window.innerWidth - 24, 794);
        const sheetWidth = 794; // 210mm in pixels at 96 DPI
        const scale = Math.min(1, Math.max(0.36, availWidth / sheetWidth));
        sheet.style.transform = `scale(${scale})`;
        sheet.style.transformOrigin = 'top center';
        if (wrapper) {
          wrapper.style.height = `${sheet.offsetHeight * scale + 30}px`;
        }
      } else {
        sheet.style.transform = 'none';
        if (wrapper) wrapper.style.height = 'auto';
      }
    }

        <button type="button" onclick="closeTemplateGallery()" class="p-2 text-slate-400 hover:text-slate-800 hover:bg-slate-200/60 rounded-xl transition-colors cursor-pointer">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Category Filter Tabs -->
      <div class="px-6 py-2.5 border-b border-slate-200 bg-white flex items-center gap-1.5 overflow-x-auto no-scrollbar shrink-0 text-xs">
        <button type="button" onclick="filterGallery('all')" class="gallery-tab-btn px-3 py-1.5 rounded-lg font-bold transition-all bg-red-600 text-white shadow-2xs whitespace-nowrap" id="tab-all">All (22)</button>
        <button type="button" onclick="filterGallery('sidebars')" class="gallery-tab-btn px-3 py-1.5 rounded-lg font-semibold text-slate-600 hover:text-slate-900 hover:bg-slate-100 transition-all whitespace-nowrap" id="tab-sidebars">📑 Sidebars (6)</button>
        <button type="button" onclick="filterGallery('timelines')" class="gallery-tab-btn px-3 py-1.5 rounded-lg font-semibold text-slate-600 hover:text-slate-900 hover:bg-slate-100 transition-all whitespace-nowrap" id="tab-timelines">⏱️ Timelines & Cards (5)</button>
        <button type="button" onclick="filterGallery('creative')" class="gallery-tab-btn px-3 py-1.5 rounded-lg font-semibold text-slate-600 hover:text-slate-900 hover:bg-slate-100 transition-all whitespace-nowrap" id="tab-creative">🎨 Creative & Luxury (5)</button>
        <button type="button" onclick="filterGallery('clean')" class="gallery-tab-btn px-3 py-1.5 rounded-lg font-semibold text-slate-600 hover:text-slate-900 hover:bg-slate-100 transition-all whitespace-nowrap" id="tab-clean">📄 Clean & ATS (6)</button>
      </div>

      <!-- Gallery Grid of 22 Visual Cards -->
      <div class="p-6 overflow-y-auto grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3.5 custom-scrollbar bg-slate-50/50 flex-1" id="gallery-grid">
        <!-- Rendered dynamically by renderGalleryCards() -->
      </div>
    </div>
  </div>
</body>
</html>
